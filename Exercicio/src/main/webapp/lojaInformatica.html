<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Loja de Informática</title>
</head>
<body>
	<h3>Produtos para Compra</h3>

	<form action="EnviaCookies" method="get" style="display:inline-block; text-align:center; margin:20px;">
		<img src="images/Fone.jpg" alt="Fone BLuetooth" width="120"><br>
		<label>Fone Bluetooth</label><br>
		<label>R$ 39,90</label><br>
		<input type="hidden" name="nomeProduto1" value="fone">
		<input type="hidden" name="precoProduto1" value="39.90">
		<input type="checkbox" id="comprarFone" name="comprarFone" value="sim">
		<label for="comprarFone">Comprar</label>

		<img src="images/tvdetubo.jpg" alt="Tv de Tubo" width="120"><br>
		<label>TV de Tubo</label><br>
		<label>R$ 32,50</label><br>
		<input type="hidden" name="nomeProduto2" value="tvdetubo">
		<input type="hidden" name="precoProduto2" value="32.50">
		<input type="checkbox" id="comprarTv" name="comprarTv" value="sim">
		<label for="comprarTv">Comprar</label>

		<img src="images/controle.jpg" alt="Controle Nintendo 64" width="120"><br>
		<label>Controle Nintendo 64</label><br>
		<label>R$ 28,00</label><br>
		<input type="hidden" name="nomeProduto3" value="controle">
		<input type="hidden" name="precoProduto3" value="28.00">
		<input type="checkbox" id="comprarControle" name="comprarControle" value="sim">
		<label for="comprarControle">Comprar</label>
	
		<img src="images/psvita.jpg" alt="PS Vita" width="120"><br>
		<label>PS Vita</label><br>
		<label>R$ 28,00</label><br>
		<input type="hidden" name="nomeProduto4" value="psvita">
		<input type="hidden" name="precoProduto4" value="28.00">
		<input type="checkbox" id="comprarVita" name="comprarVita" value="sim">
		<label for="comprarVita">Comprar</label>
	
		<p><input type="submit" value="Enviar"></p>
	</form>

</body>
</html>
